<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Player Controls</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", Inter, sans-serif;
      color: #fff;
      user-select: none;
      cursor: default;
    }
    .hud {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 28px;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .hud.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .top-bar, .bottom-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }
    .top-bar {
      justify-content: space-between;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 600px;
    }
    .btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      pointer-events: auto;
    }
    .btn:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.05);
    }
    .btn-lg {
      width: 56px;
      height: 56px;
    }
    .time {
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      color: rgba(255,255,255,0.9);
      min-width: 120px;
      text-align: center;
      pointer-events: auto;
    }
    .spacer { flex: 1; }
    .bar {
      width: 100%;
      height: 8px;
      position: relative;
      cursor: pointer;
      padding: 12px 0;
      pointer-events: auto;
    }
    .bar-track {
      position: relative;
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      width: 0%;
      border-radius: 999px;
      transition: width 0.1s linear;
    }
    .scrub-thumb {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: white;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.15s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .bar:hover .scrub-thumb {
      transform: translate(-50%, -50%) scale(1);
    }
    .volume {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 140px;
      pointer-events: auto;
    }
    .vol-track {
      position: relative;
      width: 100px;
      height: 4px;
      background: rgba(255,255,255,0.25);
      border-radius: 999px;
      cursor: pointer;
    }
    .vol-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: white;
      width: 100%;
      border-radius: 999px;
    }
    svg { width: 20px; height: 20px; }
    /* Loading screen styles */
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.3);
      transform: scale(1.1);
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
    }
    .loading-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      text-align: center;
    }
    .loading-poster {
      position: relative;
    }
    .loading-poster img {
      width: 176px;
      height: 256px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }
    .loading-progress-ring {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }
    .loading-progress-ring circle {
      fill: none;
      stroke-width: 3;
      transition: stroke-dashoffset 0.3s ease;
    }
    .loading-progress-ring .bg {
      stroke: rgba(255, 255, 255, 0.1);
    }
    .loading-progress-ring .fill {
      stroke: #06b6d4;
      stroke-linecap: round;
    }
    .loading-title {
      font-size: 24px;
      font-weight: 700;
      color: white;
    }
    .loading-year {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.6);
    }
    .loading-status {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .loading-status-text {
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
    }
    .loading-progress-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .loading-progress-track {
      width: 128px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }
    .loading-progress-fill {
      height: 100%;
      background: #06b6d4;
      transition: width 0.3s ease;
      width: 0%;
    }
    .loading-percentage {
      font-size: 14px;
      font-family: monospace;
      color: #06b6d4;
      min-width: 40px;
      text-align: right;
    }
    .loading-close-btn {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 1001;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 16px;
    }
    .loading-close-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <!-- Loading screen overlay -->
  <div class="loading-screen" id="loadingScreen">
    <button class="loading-close-btn" id="loadingCloseBtn" title="Close">✕</button>
    <div class="loading-bg" id="loadingBg"></div>
    <div class="loading-overlay"></div>
    <div class="loading-content">
      <div class="loading-poster" id="loadingPoster">
        <img id="loadingPosterImg" src="" alt="" style="display: none;">
        <svg class="loading-progress-ring" width="176" height="256" viewBox="0 0 176 256">
          <circle class="bg" cx="88" cy="128" r="40"></circle>
          <circle class="fill" cx="88" cy="128" r="40" id="progressRing" stroke-dasharray="251.2" stroke-dashoffset="251.2"></circle>
        </svg>
      </div>
      <div>
        <div class="loading-title" id="loadingTitle">Loading...</div>
        <div class="loading-year" id="loadingYear" style="display: none;"></div>
      </div>
      <div class="loading-status">
        <div class="loading-status-text" id="loadingStatusText">Connecting...</div>
        <div class="loading-progress-bar">
          <div class="loading-progress-track">
            <div class="loading-progress-fill" id="loadingProgressFill"></div>
          </div>
          <div class="loading-percentage" id="loadingPercentage">0%</div>
        </div>
      </div>
    </div>
  </div>

  <div class="hud" id="hud">
    <div class="top-bar">
      <div class="title" id="titleText">Loading...</div>
      <button class="btn" id="closeBtn" title="Close">✕</button>
    </div>
    <div class="spacer"></div>
    <div class="bottom-bar" style="flex-direction: column; gap: 12px;">
      <div class="bar" id="progressBar">
        <div class="bar-track">
          <div class="bar-fill" id="progressFill"></div>
          <div class="scrub-thumb" id="thumb"></div>
        </div>
      </div>
      <div style="display: flex; width: 100%; gap: 12px; align-items: center;">
        <button class="btn btn-lg" id="playBtn" title="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
        </button>
        <button class="btn" id="backBtn" title="Seek -10s">⏪</button>
        <button class="btn" id="forwardBtn" title="Seek +10s">⏩</button>
        <div class="time" id="timeDisplay">0:00 / 0:00</div>
        <div class="volume">
          <button class="btn" id="muteBtn" title="Mute">🔊</button>
          <div class="vol-track" id="volumeSlider">
            <div class="vol-fill" id="volumeFill"></div>
          </div>
        </div>
        <div class="spacer"></div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require("electron");
    
    let state = { time: 0, duration: 0, paused: true, volume: 1, mute: false };
    let hideTimer = null;

    const hud = document.getElementById("hud");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const thumb = document.getElementById("thumb");
    const timeDisplay = document.getElementById("timeDisplay");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const backBtn = document.getElementById("backBtn");
    const forwardBtn = document.getElementById("forwardBtn");
    const muteBtn = document.getElementById("muteBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const volumeFill = document.getElementById("volumeFill");
    const titleText = document.getElementById("titleText");
    const closeBtn = document.getElementById("closeBtn");

    const formatTime = (s) => {
      if (!isFinite(s) || s < 0) return "0:00";
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = Math.floor(s % 60);
      if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
      return `${m}:${String(sec).padStart(2,"0")}`;
    };

    const showHud = () => {
      hud.classList.remove("hidden");
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => hud.classList.add("hidden"), 3000);
    };

    const updateUI = () => {
      const pct = state.duration > 0 ? (state.time / state.duration) * 100 : 0;
      progressFill.style.width = `${pct}%`;
      thumb.style.left = `${pct}%`;
      timeDisplay.textContent = `${formatTime(state.time)} / ${formatTime(state.duration)}`;

      playIcon.style.display = state.paused ? "block" : "none";
      pauseIcon.style.display = state.paused ? "none" : "block";

      const volPct = state.mute ? 0 : Math.min(100, Math.max(0, (state.volume || 0) * 100));
      volumeFill.style.width = `${volPct}%`;
      muteBtn.textContent = state.mute ? "🔇" : "🔊";
    };

    // If playback has clearly started, hide the loading overlay even if backend buffer %
    // logic is slow/missing. Otherwise the (opaque) loader can cover the video while audio plays.
    const maybeHideLoaderOnPlayback = () => {
      // duration becomes available once mpv has probed/started playback
      if ((state.duration && state.duration > 1) || (state.time && state.time > 0.5)) {
        if (loadingState.status !== "ready") {
          loadingState.status = "ready";
          loadingState.percentage = 100;
          updateLoadingScreen();
        }
      }
    };

    const pollState = async () => {
      try {
        const result = await ipcRenderer.invoke("mpv:state");
        if (result?.ok && result?.state) {
          const s = result.state;
          state.time = typeof s.time === "number" ? s.time : state.time;
          state.duration = typeof s.duration === "number" ? s.duration : state.duration;
          state.paused = typeof s.paused === "boolean" ? s.paused : state.paused;
          state.volume = typeof s.volume === "number" ? s.volume : state.volume;
          state.mute = typeof s.mute === "boolean" ? s.mute : state.mute;
          updateUI();
          maybeHideLoaderOnPlayback();
        }
      } catch (err) {
        console.error("[controls] pollState error:", err);
      }
    };

    const seekTo = async (clientX) => {
      const rect = progressBar.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const target = pct * (state.duration || 0);
      await ipcRenderer.invoke("mpv:seek", target, false);
      showHud();
    };

    document.addEventListener("mousemove", showHud);
    document.addEventListener("click", showHud);

    playBtn.addEventListener("click", async () => {
      await ipcRenderer.invoke("mpv:pause", !state.paused);
      state.paused = !state.paused;
      updateUI();
      showHud();
    });

    backBtn.addEventListener("click", async () => {
      await ipcRenderer.invoke("mpv:seek", -10, true);
      showHud();
    });

    forwardBtn.addEventListener("click", async () => {
      await ipcRenderer.invoke("mpv:seek", 10, true);
      showHud();
    });

    muteBtn.addEventListener("click", async () => {
      await ipcRenderer.invoke("mpv:setMute", !state.mute);
      state.mute = !state.mute;
      updateUI();
      showHud();
    });

    volumeSlider.addEventListener("mousedown", (e) => {
      const setVol = async (evt) => {
        const rect = volumeSlider.getBoundingClientRect();
        const v = Math.max(0, Math.min(1, (evt.clientX - rect.left) / rect.width));
        state.volume = v;
        state.mute = v === 0;
        updateUI();
        await ipcRenderer.invoke("mpv:setVolume", v);
      };
      setVol(e);
      const move = (evt) => setVol(evt);
      const up = () => {
        window.removeEventListener("mousemove", move);
        window.removeEventListener("mouseup", up);
      };
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
    });

    progressBar.addEventListener("mousedown", (e) => {
      seekTo(e.clientX);
      const move = (evt) => seekTo(evt.clientX);
      const up = () => {
        window.removeEventListener("mousemove", move);
        window.removeEventListener("mouseup", up);
      };
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
    });

    closeBtn.addEventListener("click", async () => {
      await ipcRenderer.invoke("mpv:stop");
    });

    // Loading screen close button
    const loadingCloseBtn = document.getElementById("loadingCloseBtn");
    loadingCloseBtn.addEventListener("click", async () => {
      await ipcRenderer.invoke("mpv:stop");
    });

    document.addEventListener("keydown", async (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        await ipcRenderer.invoke("mpv:pause", !state.paused);
        state.paused = !state.paused;
        updateUI();
      } else if (e.code === "ArrowLeft") {
        e.preventDefault();
        await ipcRenderer.invoke("mpv:seek", -10, true);
      } else if (e.code === "ArrowRight") {
        e.preventDefault();
        await ipcRenderer.invoke("mpv:seek", 10, true);
      }
      showHud();
    });

    ipcRenderer.on("mpv:title", (_event, title) => {
      if (title) titleText.textContent = title;
    });

    // Loading screen state
    const loadingScreen = document.getElementById("loadingScreen");
    const loadingBg = document.getElementById("loadingBg");
    const loadingPosterImg = document.getElementById("loadingPosterImg");
    const loadingTitle = document.getElementById("loadingTitle");
    const loadingYear = document.getElementById("loadingYear");
    const loadingStatusText = document.getElementById("loadingStatusText");
    const loadingProgressFill = document.getElementById("loadingProgressFill");
    const loadingPercentage = document.getElementById("loadingPercentage");
    const progressRing = document.getElementById("progressRing");

    let loadingState = {
      status: "connecting",
      percentage: 0,
      title: "",
      year: null,
      posterUrl: null
    };

    const updateLoadingScreen = () => {
      // Show/hide loading screen
      if (loadingState.status === "ready" || loadingState.percentage >= 100) {
        loadingScreen.classList.add("hidden");
      } else {
        loadingScreen.classList.remove("hidden");
      }

      // Update poster background
      if (loadingState.posterUrl) {
        const fullPosterUrl = loadingState.posterUrl.startsWith("http")
          ? loadingState.posterUrl
          : `https://image.tmdb.org/t/p/w780${loadingState.posterUrl}`;
        loadingBg.style.backgroundImage = `url(${fullPosterUrl})`;
        loadingPosterImg.src = fullPosterUrl;
        loadingPosterImg.style.display = "block";
      } else {
        loadingBg.style.backgroundImage = "";
        loadingPosterImg.style.display = "none";
      }

      // Update title and year
      loadingTitle.textContent = loadingState.title || "Loading...";
      if (loadingState.year) {
        loadingYear.textContent = String(loadingState.year);
        loadingYear.style.display = "block";
      } else {
        loadingYear.style.display = "none";
      }

      // Update status text
      const statusTexts = {
        connecting: "Connecting...",
        buffering: "Buffering...",
        ready: "Ready"
      };
      loadingStatusText.textContent = statusTexts[loadingState.status] || "Loading...";

      // Update progress
      const pct = Math.min(100, Math.max(0, loadingState.percentage));
      loadingProgressFill.style.width = `${pct}%`;
      loadingPercentage.textContent = `${Math.round(pct)}%`;

      // Update progress ring (circumference = 2 * PI * 40 = ~251.2)
      const circumference = 2 * Math.PI * 40;
      const offset = circumference - (pct / 100) * circumference;
      progressRing.style.strokeDashoffset = String(offset);
    };

    // Listen for loading state updates
    ipcRenderer.on("mpv:loadingState", (_event, data) => {
      if (data.status) loadingState.status = data.status;
      if (typeof data.percentage === "number") loadingState.percentage = data.percentage;
      updateLoadingScreen();
    });

    // Listen for loading metadata
    ipcRenderer.on("mpv:loadingMeta", (_event, data) => {
      if (data.title) loadingState.title = data.title;
      if (data.year !== undefined) loadingState.year = data.year;
      if (data.posterUrl !== undefined) loadingState.posterUrl = data.posterUrl;
      updateLoadingScreen();
    });

    // Initialize loading screen
    updateLoadingScreen();

    setInterval(pollState, 250);
    pollState();
    showHud();
  </script>
</body>
</html>
