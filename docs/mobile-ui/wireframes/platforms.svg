74" font-size="17" fill="#dadbdf" font-weight="400">Torrents</text><svg x="430" y="253" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" color="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg><text x="530" y="274" font-size="16" fill="#dadbdf" font-weight="400">Season 1 · Episodes</text></g><g transform="translate(460,756)"><rect x="0" y="0" width="822" height="163" rx="12" fill="#191919" stroke="#34363b"/><text x="16" y="32" font-size="16" fill="#fff" font-weight="600">PLATFORM BEHAVIOR</text><text x="16" y="66" font-size="16" fill="#dadbdf" font-weight="400">Shared icons and content; platform-owned navigation and permissions.</text><text x="16" y="91" font-size="16" fill="#dadbdf" font-weight="400">Back dismisses keyboard, then source sheet, then the detail stack.</text><text x="16" y="116" font-size="16" fill="#dadbdf" font-weight="400">Small icon glyphs retain transparent touch targets of at least 48px.</text><text x="16" y="141" font-size="16" fill="#dadbdf" font-weight="400">No painted iOS home indicator on Android.</text></g><text x="24" y="1000" font-size="15" fill="#dadbdf" font-weight="400">Release, size, seeders and compatibility in rows.</text><text x="24" y="1025" font-size="15" fill="#dadbdf" font-weight="400">Long lists scroll above the fixed Play action.</text><text x="460" y="1000" font-size="15" fill="#dadbdf" font-weight="400">Source compatibility comes from validated evidence; unknown metadata stays unknown.</text><text x="460" y="1025" font-size="15" fill="#dadbdf" font-weight="400">All values shown are synthetic fixtures. No runtime or playback verification is implied.</text><text x="24" y="1064" font-size="14" fill="#a6a9af" font-weight="400">REVISED WIREFRAMES • Fictional fixtures • Icon controls retain accessible names and 48px targets</text></g></svg>