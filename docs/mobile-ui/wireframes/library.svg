weight="600">Series</text><text x="133" y="444" font-size="14" fill="#a6a9af" font-weight="400">8</text><svg x="338" y="424" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" color="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg><rect x="16" y="464" width="106" height="159" rx="8" fill="#202226" stroke="#34363b"/><path d="M28 611 L110 476 M28 476 L110 611" stroke="#34363b"/><text x="28" y="534" font-size="11" fill="#8d919a" font-weight="400">POSTER</text><text x="16" y="645" font-size="14" fill="#dadbdf" font-weight="400">Moon Harbour</text><rect x="138" y="464" width="106" height="159" rx="8" fill="#202226" stroke="#34363b"/><path d="M150 611 L232 476 M150 476 L232 611" stroke="#34363b"/><text x="150" y="534" font-size="11" fill="#8d919a" font-weight="400">POSTER</text><text x="138" y="645" font-size="14" fill="#dadbdf" font-weight="400">Quiet Orbit</text><rect x="260" y="464" width="106" height="159" rx="8" fill="#202226" stroke="#34363b"/><path d="M272 611 L354 476 M272 476 L354 611" stroke="#34363b"/><text x="272" y="534" font-size="11" fill="#8d919a" font-weight="400">POSTER</text><text x="260" y="645" font-size="14" fill="#dadbdf" font-weight="400">North Shore</text><svg x="16" y="685" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" color="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></svg><text x="49" y="706" font-size="21" fill="#fff" font-weight="600">Anime</text><text x="133" y="706" font-size="14" fill="#a6a9af" font-weight="400">6</text><svg x="338" y="687" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" color="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg><rect x="0" y="746" width="390" height="98" rx="0" fill="#111214" stroke="#34363b"/><svg x="53" y="760" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8d919a" color="#8d919a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10H3Z M9 20v-7h6v7"/></svg><text text-anchor="middle" x="65" y="801" font-size="12" fill="#a6a9af" font-weight="400">Home</text><svg x="183" y="760" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8d919a" color="#8d919a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg><text text-anchor="middle" x="195" y="801" font-size="12" fill="#a6a9af" font-weight="400">Search</text><svg x="313" y="760" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" color="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16 M9 4v16 M14 4l5 16"/></svg><text text-anchor="middle" x="325" y="801" font-size="12" fill="#fff" font-weight="600">Library</text><rect x="134" y="825" width="122" height="4" rx="2" fill="#dadbdf" stroke="none"/></g></g><g transform="translate(460,132)"><text x="0" y="-20" font-size="17" fill="#fff" font-weight="500">WF05 / FIRST CONNECTION</text><defs><clipPath id="frame5"><rect width="390" height="844" rx="24"/></clipPath></defs><rect x="0" y="0" width="390" height="844" rx="24" fill="#0a0a0a" stroke="#5c6068"/><g clip-path="url(#frame5)"><text x="20" y="29" font-size="14" fill="#dadbdf" font-weight="400">9:41</text><text x="282" y="29" font-size="12" fill="#dadbdf" font-weight="400">Wi-Fi 100%</text><text x="16" y="111" font-size="27" fill="#fff" font-weight="600">Your cinema, connected</text><text x="16" y="153" font-size="17" fill="#dadbdf" font-weight="400">Connect to your torWatch server</text><text x="16" y="178" font-size="17" fill="#dadbdf" font-weight="400">to browse, save and watch.</text><text x="16" y="239" font-size="17" fill="#fff" font-weight="500">Server address</text><rect x="16" y="260" width="358" height="54" rx="8" fill="#191919" stroke="#34363b"/><text x="30" y="294" font-size="17" fill="#a6a9af" font-weight="400">https://cinema.example</text><text x="16" y="340" font-size="14" fill="#a6a9af" font-weight="400">Example address only</text><rect x="16" y="365" width="358" height="48" rx="8" fill="#fff" stroke="#fff"/><text x="32" y="395" font-size="16" fill="#0a0a0a" font-weight="500">Connect</text><text x="16" y="465" font-size="17" fill="#dadbdf" font-weight="400">Use the private network where your</text><text x="16" y="490" font-size="17" fill="#dadbdf" font-weight="400">server is available. Your saved titles</text><text x="16" y="515" font-size="17" fill="#dadbdf" font-weight="400">and progress stay on that server.</text><svg x="16" y="620" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" color="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6 M12 7v1"/></svg><text x="51" y="640" font-size="17" fill="#fff" font-weight="500">Connection help</text><text x="16" y="681" font-size="16" fill="#dadbdf" font-weight="400">Check the address and network.</text><text x="16" y="706" font-size="16" fill="#dadbdf" font-weight="400">The OS handles access permissions.</text><rect x="134" y="825" width="122" height="4" rx="2" fill="#dadbdf" stroke="none"/></g></g><g transform="translate(896,132)"><text x="0" y="-20" font-size="17" fill="#fff" font-weight="500">WF08 / CONNECTION FAILURE</text><defs><clipPath id="frame6"><rect width="390" height="844" rx="24"/></clipPath></defs><rect x="0" y="0" width="390" height="844" rx="24" fill="#0a0a0a" stroke="#5c6068"/><g clip-path="url(#frame6)"><text x="20" y="29" font-size="14" fill="#dadbdf" font-weight="400">9:41</text><text x="282" y="29" font-size="12" fill="#dadbdf" font-weight="400">Wi-Fi 100%</text><svg x="16" y="60" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" color="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7"/></svg><text x="16" y="191" font-size="27" fill="#fff" font-weight="600">Cannot reach your server</text><text x="16" y="236" font-size="17" fill="#dadbdf" font-weight="400">Check your connection and make</text><text x="16" y="261" font-size="17" fill="#dadbdf" font-weight="400">sure the server is running.</text><text x="16" y="286" font-size="17" fill="#dadbdf" font-weight="400">Your saved library is unchanged.</text><rect x="16" y="333" width="358" height="48" rx="8" fill="#fff" stroke="#fff"/><svg x="30" y="346" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" color="#0a0a0a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7a9 9 0 1 0 1 8 M20 2v6h-6"/></svg><text x="62" y="363" font-size="16" fill="#0a0a0a" font-weight="500">Retry</text><rect x="16" y="393" width="358" height="48" rx="8" fill="#202226" stroke="#45484f"/><text x="32" y="423" font-size="16" fill="#fff" font-weight="500">Edit server address</text><rect x="16" y="501" width="358" height="152" rx="8" fill="#191919" stroke="#34363b"/><text x="32" y="536" font-size="19" fill="#fff" font-weight="500">Showing saved information</text><text x="32" y="568" font-size="16" fill="#dadbdf" font-weight="400">Cached titles may be out of date.</text><text x="32" y="593" font-size="16" fill="#dadbdf" font-weight="400">Reconnect before saving changes</text><text x="32" y="618" font-size="16" fill="#dadbdf" font-weight="400">or starting playback.</text><rect x="134" y="825" width="122" height="4" rx="2" fill="#dadbdf" stroke="none"/></g></g><text x="24" y="1000" font-size="15" fill="#dadbdf" font-weight="400">Collection tabs are underlined, not pills.</text><text x="24" y="1025" font-size="15" fill="#dadbdf" font-weight="400">Each media shelf has a count and full grid.</text><text x="460" y="1000" font-size="15" fill="#dadbdf" font-weight="400">Filled actions have compact rectangular corners.</text><text x="460" y="1025" font-size="15" fill="#dadbdf" font-weight="400">Settings and Back use bare icons.</text><text x="896" y="1000" font-size="15" fill="#dadbdf" font-weight="400">Keep words on recovery actions for clarity.</text><text x="896" y="1025" font-size="15" fill="#dadbdf" font-weight="400">No provider secrets on the phone.</text><text x="24" y="1064" font-size="14" fill="#a6a9af" font-weight="400">REVISED WIREFRAMES • Fictional fixtures • Icon controls retain accessible names and 48px targets</text></g></svg>