name: homelab-postgres

networks:
  database:
    name: homelab-db
    internal: true

volumes:
  postgres-data:
    name: homelab-postgres-data

services:
  postgres:
    image: postgres:16.9-alpine
    container_name: homelab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-postgres}
      MOVIE_WATCHER_POSTGRES_USER: ${MOVIE_WATCHER_POSTGRES_USER:?MOVIE_WATCHER_POSTGRES_USER is required}
      MOVIE_WATCHER_POSTGRES_PASSWORD: ${MOVIE_WATCHER_POSTGRES_PASSWORD:?MOVIE_WATCHER_POSTGRES_PASSWORD is required}
      MOVIE_WATCHER_POSTGRES_DB: ${MOVIE_WATCHER_POSTGRES_DB:-torwatch}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro,Z
    networks:
      database:
        aliases:
          - homelab-postgres
    ports:
      - "127.0.0.1:${POSTGRES_ADMIN_PORT:-5432}:5432"
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
