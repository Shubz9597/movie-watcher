# Optional VPN/challenge-helper override (plan P7; handoff §optional VPN).
# Apply with: docker compose -f compose.yaml -f compose.vpn.yaml up -d
# Gluetun fronts Prowlarr's egress; the internal topology is otherwise
# unchanged and nothing new is exposed to the client network.
services:
  gluetun:
    image: qmcgaw/gluetun:v3
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?set in .env when VPN profile is used}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set in .env}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-}
    volumes:
      - torrentdata:/gluetun
    networks:
      - internal

  prowlarr:
    networks:
      internal:
        aliases:
          - prowlarr-vpn
