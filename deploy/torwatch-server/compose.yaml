# torWatch homeserver stack — DIRECT mode (plan P7, FR-008/FR-009).
# Standalone package: never the root docker-compose.yml (Electron-owned).
#
# Mode: this file is direct mode — no Gluetun, no VPN credentials required.
# Prowlarr and FlareSolverr use the host's normal outbound route. For
# embedded-VPN mode add the optional overlay:
#
#   docker compose --env-file .env -f compose.yaml -f compose.vpn.yaml ...
#
# Publishing: only the Caddy gateway is published to the LAN (FR-008).
# Prowlarr's admin UI is loopback-only (127.0.0.1) for operator
# administration via `ssh -L 9696:127.0.0.1:9696 <host>`; it is NOT
# reachable from other LAN hosts. PostgreSQL, FlareSolverr and the Go
# service publish nothing.
#
# Storage: all persistent state lives beneath the operator's
# TORWATCH_DATA_DIR bind-mounted tree (architecture §6). SELinux-enforcing
# hosts (Fedora) set SELINUX_MOUNT_OPTS=,z in .env — see the Fedora runbook.
#
# Secrets come exclusively from the operator's .env file — never committed,
# never baked into images, never echoed to logs.

name: torwatch-server

networks:
  # Application bridge (non-internal): services that need the host's normal
  # outbound route (prowlarr, flaresolverr) plus the gateway and vod. LAN
  # exposure is governed ONLY by published ports — just the gateway's.
  gateway:
  # East-west isolation for PostgreSQL: no outbound route, reachable only by
  # the application service.
  internal:
    internal: true

services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-torwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-torwatch}
      TZ: ${TZ:-UTC}
    volumes:
      - ${TORWATCH_DATA_DIR:?TORWATCH_DATA_DIR is required}/postgres:/var/lib/postgresql/data:rw${SELINUX_MOUNT_OPTS:-}
    networks:
      - internal
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-torwatch} -d ${POSTGRES_DB:-torwatch}"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ${TORWATCH_DATA_DIR:?TORWATCH_DATA_DIR is required}/prowlarr:/config:rw${SELINUX_MOUNT_OPTS:-}
    networks:
      # Outbound indexer traffic uses the host's normal route in direct mode.
      - gateway
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    # Loopback-only administration (architecture §2: never 0.0.0.0:9696).
    # Reach it from a workstation with:
    #   ssh -L 9696:127.0.0.1:9696 <user>@<torwatch-host>
    ports:
      - "127.0.0.1:${PROWLARR_ADMIN_PORT:-9696}:9696"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    networks:
      # Outbound challenge traffic uses the host's normal route in direct mode.
      - gateway
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  vod:
    image: ${TORWATCH_IMAGE:?TORWATCH_IMAGE must pin an immutable tag, e.g. torwatch-server:2.0.0-rc.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Inherited from the image; overridden to widen the cold-start window
      # (first boot waits on Prowlarr bootstrap).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4001/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 5
    environment:
      PG_DSN: postgres://${POSTGRES_USER:-torwatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-torwatch}?sslmode=disable
      PROWLARR_URL: http://prowlarr:9696
      # Headless Prowlarr bootstrap: the backend reads the generated key from
      # the read-only config mount when PROWLARR_API_KEY is not supplied
      # (internal/bootstrap; no circular key setup on first install).
      PROWLARR_CONFIG_FILE: /prowlarr-config/config.xml
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      LISTEN: 0.0.0.0:4001
      TORRENT_DATA_ROOT: /data/torrents
      SUB_CACHE_DIR: /data/subcache
      # Source payloads also created by offline preparation are reclaimable.
      CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-21474836480}
      CACHE_EVICT_TTL: ${CACHE_EVICT_TTL:-24h}
      TORRENT_LISTEN_PORT: ${TORRENT_LISTEN_PORT:-0}
      # Optional SOCKS5 proxy for BitTorrent peer connections, e.g.
      # socks5://warp:1080 (Cloudflare WARP; ISPs that throttle BitTorrent
      # cannot see through it). Falls back to direct dials if it is down.
      TORRENT_PEER_PROXY: ${TORRENT_PEER_PROXY:-}
      LOG_FILE: /data/logs/backend.log
      ERROR_LOG_FILE: /data/logs/errors.log
      # Direct VLC playback on small hosts; video conversion is opt-in.
      PLAYBACK_TRANSCODE_MODE: ${PLAYBACK_TRANSCODE_MODE:-off}
      PLAYBACK_MAX_TRANSCODES: ${PLAYBACK_MAX_TRANSCODES:-1}
      PLAYBACK_MAX_SESSIONS: ${PLAYBACK_MAX_SESSIONS:-2}
      TARGET_BUFFER_MAX_BYTES: ${TARGET_BUFFER_MAX_BYTES:-134217728}
      WARM_READ_AHEAD_MB: ${WARM_READ_AHEAD_MB:-64}
      WARM_READ_AHEAD_MB_4K: ${WARM_READ_AHEAD_MB_4K:-64}
      OPENSUB_API_KEY: ${OPENSUB_API_KEY:-}
      OPENSUB_USER_TOKEN: ${OPENSUB_USER_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TORWATCH_ALLOWED_CLIENT_ORIGINS: ${TORWATCH_ALLOWED_CLIENT_ORIGINS:-null,http://localhost:5173}
      TORWATCH_APP_VERSION: ${TORWATCH_VERSION:-dev}
    volumes:
      - ${TORWATCH_DATA_DIR:?TORWATCH_DATA_DIR is required}/downloads:/data/torrents:rw${SELINUX_MOUNT_OPTS:-}
      - ${TORWATCH_DATA_DIR:?TORWATCH_DATA_DIR is required}/subtitles:/data/subcache:rw${SELINUX_MOUNT_OPTS:-}
      - ${TORWATCH_DATA_DIR:?TORWATCH_DATA_DIR is required}/logs:/data/logs:rw${SELINUX_MOUNT_OPTS:-}
      # Read-only view of Prowlarr's generated configuration for bootstrap.
      - ${TORWATCH_DATA_DIR:?TORWATCH_DATA_DIR is required}/prowlarr:/prowlarr-config:ro${SELINUX_MOUNT_OPTS:-}
    networks:
      - gateway
      - internal
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  gateway:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      - vod
    ports:
      # The ONLY LAN-published service (FR-008).
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro${SELINUX_MOUNT_OPTS:-}
    networks:
      - gateway
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
