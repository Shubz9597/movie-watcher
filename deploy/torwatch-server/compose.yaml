# torWatch homeserver stack (plan P7, FR-008/FR-009).
# Standalone package: never the root docker-compose.yml (Electron-owned).
#
# Container names are the DEFAULT service names (postgres, prowlarr, etc.)
# so other Docker projects on shared networks can resolve them by hostname.
# Only Caddy exposes ports to the host network; postgres/prowlarr/vod stay
# on the internal network (FR-008). Secrets come exclusively from the
# operator's .env file — never committed, never baked into images.
#
# VPN: Prowlarr + FlareSolverr route through Gluetun (Mullvad WireGuard) so
# indexers behind ISP blocks / Cloudflare are reachable. The vod backend
# stays DIRECT (torrent peers + TMDb work without VPN). Set
# WIREGUARD_PRIVATE_KEY in .env to activate; leave empty to run without VPN.
name: torwatch-server

networks:
  gateway:
  internal:
    internal: true

volumes:
  pgdata:
  torrentdata:
  subcache:

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-mullvad}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-Switzerland}
      SERVER_CITIES: ${VPN_SERVER_CITIES:-}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      # Prowlarr web UI + FlareSolverr, reachable on the host for management.
      # Both services share Gluetun's network namespace, so these ports are
      # bound to Gluetun's interfaces.
      - "${PROWLARR_PORT:-9696}:9696"
      - "${FLARESOLVERR_PORT:-8191}:8191"
    volumes:
      - torrentdata:/gluetun
    networks:
      # Gateway (internet-accessible) for the VPN tunnel; the internal
      # network is internal:true = no outbound, which blocks WireGuard.
      - gateway

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-torwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-torwatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-torwatch}"]
      interval: 10s
      timeout: 3s
      retries: 10

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    depends_on:
      - gluetun
    # ALL traffic through the Gluetun VPN tunnel: indexers behind ISP blocks
    # and Cloudflare are reachable. Shares Gluetun's network namespace, so
    # Prowlarr's port 9696 is accessible via the gluetun hostname.
    network_mode: service:gluetun
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - torrentdata:/config

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    depends_on:
      - gluetun
    # Same VPN route as Prowlarr (solves Cloudflare for the same indexers).
    network_mode: service:gluetun
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}

  vod:
    image: ${TORWATCH_IMAGE:?TORWATCH_IMAGE must pin an immutable tag, e.g. torwatch-server:1.0.0}
    container_name: torwatch-vod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DSN: postgres://${POSTGRES_USER:-torwatch}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-torwatch}?sslmode=disable
      # Prowlarr shares Gluetun's network namespace: reachable at gluetun:9696.
      PROWLARR_URL: http://gluetun:9696
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:?PROWLARR_API_KEY is required}
      LISTEN: 0.0.0.0:4001
      TORRENT_DATA_ROOT: /data/torrents
      SUB_CACHE_DIR: /data/subcache
      WATCH_MAX_ACTIVE_TITLES: ${WATCH_MAX_ACTIVE_TITLES:-1}
      # Direct VLC playback on small hosts; video conversion is opt-in.
      PLAYBACK_TRANSCODE_MODE: ${PLAYBACK_TRANSCODE_MODE:-off}
      PLAYBACK_MAX_TRANSCODES: ${PLAYBACK_MAX_TRANSCODES:-1}
      PLAYBACK_MAX_SESSIONS: ${PLAYBACK_MAX_SESSIONS:-2}
      TARGET_BUFFER_MAX_BYTES: ${TARGET_BUFFER_MAX_BYTES:-134217728}
      WARM_READ_AHEAD_MB: ${WARM_READ_AHEAD_MB:-64}
      WARM_READ_AHEAD_MB_4K: ${WARM_READ_AHEAD_MB:-64}
      OPENSUB_API_KEY: ${OPENSUB_API_KEY:-}
      OPENSUB_USER_TOKEN: ${OPENSUB_USER_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TORWATCH_APP_VERSION: ${TORWATCH_VERSION:-dev}
    volumes:
      - torrentdata:/data/torrents
      - subcache:/data/subcache
    networks:
      - gateway
      - internal

  gateway:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - vod
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - gateway
